<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRACER AI v2</title>
  
  <!-- Favicon -->
  <link rel="icon" href="data:,">
  
  <!-- Google Fonts - preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Design tokens & base styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
</head>
<body>
  <div class="app">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="wordmark">
        <svg class="wordmark-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 3l18 18M3 21L21 3"/>
        </svg>
        <span>TRACER</span>
      </div>
      
      <div class="case-number small-caps">
        Case No. <span id="caseNumber">001</span>
      </div>
      
      <div class="mode-switch" role="radiogroup" aria-label="Analysis mode">
        <button class="mode-btn active" role="radio" aria-checked="true" data-mode="debug">
          Debug
        </button>
        <button class="mode-btn" role="radio" aria-checked="false" data-mode="review">
          Review
        </button>
        <button class="mode-btn disabled" role="radio" aria-checked="false" data-mode="explain" title="Coming soon">
          Explain <span class="btn-label">soon</span>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main">
      <!-- Left Panel: Editor -->
      <section class="panel panel-left">
        <header class="editor-header">
          <h2 class="panel-title">Exhibit A — Source</h2>
          <div class="editor-actions">
            <button class="btn" id="uploadBtn" aria-label="Upload file">
              Upload
            </button>
            <button class="btn btn-primary" id="traceBtn" aria-label="Run analysis">
              Trace Code
            </button>
          </div>
        </header>
        
        <div class="editor-container" id="editorContainer">
          <!-- CodeMirror will be mounted here by main.js -->
        </div>
        
        <footer class="status-bar">
          <div class="status-item">
            <span id="statusLanguage">Python</span>
            <span class="status-separator">•</span>
            <span id="statusLines">0 lines</span>
            <span class="status-separator">•</span>
            <span id="statusChars">0 chars</span>
          </div>
          <div class="status-item">
            <span id="statusMessage">Ready</span>
          </div>
        </footer>
      </section>

      <!-- Right Panel: Report -->
      <section class="panel panel-right">
        <header class="report-header">
          <h2 class="report-title">Report</h2>
          <div class="verdict" id="verdict">
            —
          </div>
        </header>
        
        <div class="report-content" id="reportContent">
          <div class="empty-state">
            <div class="empty-state-title">No analysis yet</div>
            <p class="empty-state-text">
              Paste or upload source code, then click <strong>Trace Code</strong> to begin analysis.
            </p>
          </div>
        </div>
        
        <div class="examples">
          <div class="examples-title">Try an example</div>
          <div class="examples-grid">
            <button class="example-btn" data-example="python">
              Python bug
            </button>
            <button class="example-btn" data-example="javascript">
              JavaScript bug
            </button>
            <button class="example-btn" data-example="c">
              C bug
            </button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Hidden file input -->
  <input type="file" id="fileInput" accept=".py,.js,.java,.cpp,.c,.sql,.ts,.jsx,.tsx" hidden>

  <!-- All JavaScript in external module (CSP compliant) -->
  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
